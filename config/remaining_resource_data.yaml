provenance:
  native_remaining_68e0_rodata: Cluster formerly .data_remaining_09EF68E0 is const pointer tables in existing remaining_resource_data.c; ordinary .rodata replaces the forced section (TU already has .data).
  bounds: Twelve physical gaps are bounded by already-proven neighboring C sections, independently for each region. The gap file named5C6C actually starts5CAC, after the already-owned64-byte pool. Native EU SIO/status expansions retain their actual extra resource arrays; inactive interpolated US aliases are not fabricated as objects.
  consumers: 'All native complete AnimHeader frame indices prove gfx extents except explicit consumer bounds: SIO battle three graphics and Boolean two-player state; SIO options gfx0..2; Wlogo Won loop0..9; status scrollbar gfx4; status tab GetMaxSpriteTileBytes4; stock_mes_disp_0 selectors0/1. EU five-language status wrappers prove their actual gfx3/gfx4 target arrays. gUnk_09EF3884 dormant EU three-Sprite counterpart has exactly the same complete renderer payloads as the US/JP explicitly indexed array.'
  unused: Unselected native pairs retain decoded complete header/frame shape without claiming runtime reachability. Suffix words remain neutral scalar graphics pointers. One separate unused animation pointer follows an already-owned animation group. Zero-frame animation headers are preserved; they do not imply invented gfx array bounds.
  assets: Version-active Sprite/AnimHeader asset bindings have exact complete format extents and original ROM hashes. Metadata stays counted. Existing native symbol policies are removed only after exact address equality, with one canonical declaration header.
  native_remaining_3884: The remaining-resource pointer cluster at .data_remaining_09EF3884 is a contiguous initialized-data run (204B US/JP, 372B EU) with matching source order in remaining_resource_data.c; ordinary .data replaces its forced section attributes. Neighboring remaining-resource clusters stay sectioned.
  native_remaining_consumer_leftovers: 'Split exclusive external-consumer remaining-resource islands into native .data TUs: wlogo (.data_remaining_09EF36D0), poo (.data_remaining_09EF5B2C), evt (.data_remaining_09EF5CAC).'
