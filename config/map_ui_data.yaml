version: 1
provenance:
  map_ui: Native regional map-menu resource indices. Direct DrawSprite calls prove each constant sprite bound; the options selector explicitly cycles0..6, with a separate index7 disabled-state sprite in the first option arrays. Every remaining word is a separate typed resource-pointer scalar. Exact original Sprite/OAM and AnimHeader/frame containers supply version-active binary asset bindings; no localized glyph identity or uniform regional offset is assumed. EU adds four border variants and localized menu/save/option arrays between independently owned animation tables and gTaskDescBosGa.
  native_catalog_sections: 'The existing map UI catalog contains sprite-frame lists and their animation pointers for the same menu and save-screen consumers. Four common objects formerly split between map_resource_data.c and animation_resource_data.c are referenced by the same map.c UI callbacks: a three-frame border list with its stored animation pointer and a four-frame animated list with its animation pointer. Their complete 36-byte group precedes the existing UI catalog in US/JP and follows an EU-only UI prefix in EU. Whole-declaration ordering consistent with every regional original sequence produces one native initialized-data run. The catalog boundary is a reconstruction assumption supported by common types and consumers, regional object order and ordinary compiler output; no original filename is claimed. All initializers, qualification, types, physical extents, guards, assets and relocation targets are unchanged. Canonical table declarations and required asset declarations now live in the map UI headers.'
