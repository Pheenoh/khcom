version: 1
provenance:
  details: mode_jiminy.c:568-654 selects 16 JiminyDetail groups with explicit counts totaling 319; each detail text and lineCount defines one live line-pointer array. The 319 details alias exactly 270 descriptions identically in all three regions.
  menus: JiminyEntry.unk_04 and unk_08 provide the menu-name pointer and count to func_0805A95C at mode_jiminy.c:135-144 and254-265. Reachable category indices prove all21 entries and19 distinct arrays.
  placeholders: jiminy_list.c:132-143 clamps the selected index to0..12 before LoadTextSlots.
  eu_text: eu_0805E968 selects one of five pointers at offsets0,4,8,12,16; eu_0805E9AC selects the corresponding u16 line count at20,22,24,26,28. All270 records have zero trailing16-bit padding.
  eu_names: eu_0805E924 selects one of five pointers at offsets0,4,8,12,16. Menu names flow through jiminy_list.c:223; detail names through mode_jiminy.c:723,746,770.
  save: save.h defines SAVE_SIGNATURE_SIZE as24; save.c compares/copies exactly24 bytes through gSaveSignature. US/JP use version12 and EU version13.
  inline_eu_world_names: Twenty-five original single-byte null-terminated strings are defined by the five established JiminyLocalizedName language-pointer records at 0888E364 through 0888E4C0. Individual extents end at their native terminators; the six remaining bytes are independently checked native four-byte object alignment, not fabricated data. Existing pointer identities and all encoded byte values are preserved.
  inline_jp_description_text: Eighteen existing Jiminy description-pointer targets at 0813FEB8..08140081 are native Shift-JIS null-terminated strings, each independently bounded by the original text asset evidence and its terminator. Compiler definitions retain every native byte and symbol, including five text bytes beyond the old accidental report-classification boundary. All three-byte or one-byte alignment between strings and the initial three-byte gap are separately checked native four-byte alignment, not array elements.
  save_native_owner: The version signature is only compared and copied from by save.c; the pointer has no other consumer. Treating the unchanged signature bytes as const is an explicit reconstruction assumption supported by these read-only uses. Both signature and pointer use the code owner's ordinary readonly and initialized-data sections, retaining their original independent addresses, sizes, regional version text and natural alignment. The error-screen asset arrays stay unchanged in save.c.
  inline_native_catalog: The existing mutable text definitions are retained as an explicit generated-catalog storage assumption, not evidence of runtime writes. EU world-name strings and their five language-pointer wrappers form one complete run shared by journal, SIO, map and world UI consumers; keeping the wrappers beside their strings removes the earlier split by C type. JP description lines form the complete existing string run. Ordinary initialized data reproduces each unchanged object, string terminator, interior alignment and existing initial three-byte alignment gap. No asset bytes, array extents, qualifiers or unrelated Jiminy wrappers are changed.
  native_jiminy_name_275_rodata: EU JiminyLocalizedName gUnkEu_0888E530 (20B) formerly .rodata_jiminy_name_275 is const in existing jiminy_data.c; ordinary .rodata replaces the forced section (TU free .rodata slot, EU-only).
  split_eu_jiminy_localized_names: EU JiminyLocalizedName records were each an island in units.txt, interleaved with rodata_script_at_*.s string blobs, so they could not share one native .rodata with jiminy_data.c (already holding gUnkEu_0888E530). Split each remaining forced record into jiminy_eu_<name>_name.c (content slug from English label) with ordinary const .rodata; same interleaving evidence pattern as map_text_eu_*_name and staff_roll sprite splits.
  split_eu_jiminy_localized_texts: SUPERSEDED by rebank_eu_jiminy_localized_texts.
  rebank_eu_jiminy_localized_texts: Collapsed 270 jiminy_eu_*_text.c micro-TUs and mislabeled asset_gfx_at_* pools into one native .rodata bank (jiminy_eu_localized_text_data.c). Payload is asm/eu/jiminy_eu_localized_text_data.inc (.byte data + labels) included via asm(), because agbcc structs pad to align-4 and legacy as has no .incbin. No forced sections.
