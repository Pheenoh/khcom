version: 1
provenance:
  native: Native actor/allmap/title resource pointers,42 pairs inUS/JP and66 inEU. EU title-language arrays have actual native shapes; inactive generic US aliases into EU array interiors are not fabricated as objects.
  bounds: Complete AnimHeader frames prove graphics extents except direct allmap i<4, title signed-effect0..2, and title native menu selector4,5,1,2. EU five-language selectors independently identify inner arrays of3 or6 graphics. Existing mode-title graphics scalar semantics are retained.
  unused: Unreferenced resource pairs retain exact decoded header/frame shapes; no runtime reachability is claimed. Two US/JP and six EU graphics suffix words are separate neutral pointer scalars, not inflated arrays.
  assets: Version-local Sprite/AnimHeader assets have complete format extents and original ROM hashes; already managed targets reuse their existing canonical declaration headers. No cross-region data-pointer mapping is inferred.
  native_catalog: The existing actor and UI resource catalog consists of homogeneous sprite-frame and animation-pointer definitions, with one complete initialized-data run per region. Removing the repeated recovery section attribute leaves the same typed definitions in their existing source order and version guards. Ordinary data sections reproduce every original object offset, size, initializer and relocation; the file has no nonempty readonly or RAM section. Retaining this logical catalog as a data-only translation unit is a reconstruction assumption, without a claim about the original filename or generator boundary. All resource assets and existing bounds remain unchanged.
