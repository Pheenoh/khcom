    - { offset: 0x18, type: u32, name: sampleRate }
    - { offset: 0x1C, type: u32, name: audioCodecId }
  note: >
    Followed by frameTypes block, video sizes/payload, optional audio
    meta + sizes/payload. See tools/movie_assets.py and src/movie_player.c
    MovieOpen. Apparent "magic" f0000000 a0000000 == width 240, height 160.

