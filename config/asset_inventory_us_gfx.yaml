  summary: >
    Named megablob owned by asm/us/asset_gfx.s as a single .incbin.
    Four large subranges are KHCOM movie streams (same container as
    asset_movie_opening). Bytes f0000000 a0000000 are LE u32 width=240
    and height=160, not a custom magic. Consumed by mode_movie.c via
    MovieStart/MovieOpen. Tail holds MovieSub pointer tables and the
    ASCII label MOVIE (sMovieHeapName). Trailing pad after each in-pack
    movie_extent may include 0x22 fill and/or UTF-16LE subtitle strings.

