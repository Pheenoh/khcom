    Do not PNG-ify the whole 3.71 MB pack. RE the f0000000 a0000000 chunk
    container first; split into sub-leaves; only then introduce gbagfx PNG
    round-trips where tile size and palette are known from consumers.
  lz77: >
    BIOS LZ77 is not the pack framing. Optional LZ leaves may appear inside
    chunks after demux — audit per child, do not assume whole-pack LZ.
  gbagfx: >
    Prefer pret gbagfx for PNG↔4bpp/pal once leaves exist. Matching grief on
    LZ or pack framing may require in-tree helpers later.

