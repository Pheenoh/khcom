png_lz_plan:
  immediate: >
    Treat the four f0000000/a0000000 regions as movie containers (240x160 @ 15fps).
    Dump with tools/gfx/asset_gfx_dump.py. Do not PNG-ify via gbagfx tiles.
  frames: >
    Leaf PNG = decoded RGB555 framebuffer per frame after movie_codec runs.
    Dimensions known (240x160). Matching recompress still blocked on encoders.
  lz77: >
    BIOS LZ77 is not the pack framing. Video/audio use the custom movie codecs.
  gbagfx: >
    gbagfx remains preferred for true tile/pal leaves elsewhere. Not applicable
    to these movie payloads.

blockers:
  - matching video bitstream encoder for movie_codec (decode path exists)
  - matching audio codec id 2 encoder
  - exact region pad / subtitle string pool layout for bit-identical pack
  - JP/EU address translation for in-pack movies not inventoried (US-first)
  - matching recompress path not proven (Phase 1 flag stays off by default)
