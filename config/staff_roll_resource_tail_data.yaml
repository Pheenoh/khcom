version: 1
provenance:
  pc: 'The96 owned PcSpriteCmd streams contain4284 nonterminal records in each region. func_0810A018 branches on flagbit0: set selects every value0..18 from gUnk_09EFAB18; clear selects every value0..39 from gUnk_09EFBB18. Each latter target is a complete single-OAM Sprite of8 bytes and retains the existing canonical PcSpriteDef type. Each index is followed by a distinct AnimHeader pointer, not an extra gfx element.'
  timer: task_sroll_tmr_2 directly selects decimal digits0..9 and separator10 from gUnk_09EFBAE8[11]. The next word is a separate complete AnimHeader target.
  dormant: Remaining native resource pairs have complete Sprite and AnimHeader formats. Graphics array bounds follow maximum actual frame indices. Twenty-three unused graphics suffix words remain separate scalar pointers; no extra runtime-reachable elements are claimed.
  assets: Native binary Sprite/AnimHeader bindings retain exact format extents and ROM hashes. The PcSpriteDef view is canonical for the40 single-OAM records used directly by bos6; this is not metadata reclassification. No cross-region inferred asset correspondence is introduced.
  native_staff_roll_tail_bc40: The gUnk_*09EFBC40 staff-roll pointer/AnimHeader cluster is a contiguous 644-byte initialized-data run with matching source order under each VERSION_* block in staff_roll_resource_tail_data.c; ordinary .data replaces its forced section attributes. Earlier smaller staff-roll tail clusters stay sectioned.
  native_staff_roll_tail_AEE4_rodata: Five pointer/AnimHeader words formerly .data_staff_roll_tail_09EFAEE4 (20B) are const in existing staff_roll_resource_tail_data.c; ordinary .rodata replaces the forced section (TU free .rodata slot).
  split_command_and_timer_sprite_tus: ROM islands for the bos6 command-sprite pointer cluster and the staff-roll timer-digit/sprite cluster were interleaved with animation_resource_data (and related) units, so they could not share native .data with staff_roll_resource_tail_data.c. Split into staff_roll_command_sprite_data.c and staff_roll_timer_sprite_data.c (content names) with ordinary .data; same interleaving evidence pattern as animation_resource_data_* splits.
