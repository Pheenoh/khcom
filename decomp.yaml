name: Kingdom Hearts - Chain of Memories
repo: https://github.com/Pheenoh/khcom
platform: gba
build_system: ninja
versions:
  - name: us
    fullname: USA (B8CE)
    sha1: 10729bd884f8fdca7a310b6d606c52e46657aa48
    paths:
      target: "roms/B8CE.gba"
      build_dir: "build/us"
      map: "build/us/com_us.map"
      compiled_target: "build/us/com_us.gba"
      elf: "build/us/com_us.elf"
      asm: "asm/us"
      nonmatchings: "asm/us/nonmatchings"
  - name: jp
    fullname: Japan (B8CJ)
    sha1: 59ec0a0a4ccd1e6acb3bbd7bfb21d63988958cfa
    paths:
      target: "roms/B8CJ.gba"
      build_dir: "build/jp"
      map: "build/jp/com_jp.map"
      compiled_target: "build/jp/com_jp.gba"
      elf: "build/jp/com_jp.elf"
      asm: "asm/jp"
      nonmatchings: "asm/jp/nonmatchings"
  - name: eu
    fullname: Europe (B8CP)
    sha1: 8db73586cdb11b3795907edebf43228dbcd3e6b2
    paths:
      target: "roms/B8CP.gba"
      build_dir: "build/eu"
      map: "build/eu/com_eu.map"
      compiled_target: "build/eu/com_eu.gba"
      elf: "build/eu/com_eu.elf"
      asm: "asm/eu"
      nonmatchings: "asm/eu/nonmatchings"

tools:
  mapfile_parser:
    progress_report:
      check_asm_paths: True
      # Objects live at build/<ver>/asm/foo.o -> asm file lookup starts at part 3
      path_index: 3
      # The ROM's ~32 MB of assets are .rodata. Counting them would put every
      # headline percentage near zero; pret, kleod and knidl all report code only.
      report_data: False
      prefixes_to_trim:
        - build/us/
        - build/jp/
        - build/eu/
        - build/

      # Module names come from the ROM's own task and mode registration tables
      # (tools/gen_symbols.py), so these buckets group by evidence, not guesswork.
      # Anything whose subsystem is not established stays in `named` or `unidentified`.
      categories:
        - id: core
          name: Core & engine
          paths:
            - src/main
            - src/malloc
            - src/taskpool
            - src/key
            - src/sprite
            - src/engine
            - src/sio
            - src/pallet
            - src/util
            - src/task
            - src/save

        - id: battle
          name: Battle
          paths:
            - src/btl
            - src/bos
            - src/emy

        - id: card
          name: Card system
          paths:
            - src/card

        - id: modes
          name: Game modes
          paths:
            - src/mode_

        - id: sound
          name: Sound & movie
          paths:
            - src/m4a
            - src/snd_stream
            - src/movie

        - id: library
          name: Library
          paths:
            - lib/
            - src/lib
            - src/agb_sram

        - id: named
          name: Other named subsystems
          paths:
            - src/acgtrans
            - src/allmap
            - src/chara
            - src/evt
            - src/fld
            - src/frd
            - src/hum
            - src/monsgage
            - src/ms
            - src/pc
            - src/poo
            - src/romcri
            - src/room
            - src/smn
            - src/sroll
            - src/status
            - src/title
            - src/tutorial
            - src/wlogo

        - id: unidentified
          name: Unidentified
          paths:
            - src/unk_

        - id: asm
          name: Raw assembly
          paths:
            - asm/
