name: Kingdom Hearts - Chain of Memories
repo: https://github.com/Pheenoh/khcom
platform: gba
build_system: ninja
versions:
  - name: us
    fullname: USA (B8CE)
    sha1: 10729bd884f8fdca7a310b6d606c52e46657aa48
    paths:
      target: "roms/B8CE.gba"
      build_dir: "build/us"
      map: "build/us/com_us.map"
      compiled_target: "build/us/com_us.gba"
      elf: "build/us/com_us.elf"
      asm: "asm/us"
  - name: jp
    fullname: Japan (B8CJ)
    sha1: 59ec0a0a4ccd1e6acb3bbd7bfb21d63988958cfa
    paths:
      target: "roms/B8CJ.gba"
      build_dir: "build/jp"
      map: "build/jp/com_jp.map"
      compiled_target: "build/jp/com_jp.gba"
      elf: "build/jp/com_jp.elf"
      asm: "asm/jp"
  - name: eu
    fullname: Europe (B8CP)
    sha1: 8db73586cdb11b3795907edebf43228dbcd3e6b2
    paths:
      target: "roms/B8CP.gba"
      build_dir: "build/eu"
      map: "build/eu/com_eu.map"
      compiled_target: "build/eu/com_eu.gba"
      elf: "build/eu/com_eu.elf"
      asm: "asm/eu"

tools:
  mapfile_parser:
    progress_report:
      check_asm_paths: True
      # Objects live at build/<ver>/asm/foo.o -> asm file lookup starts at part 3
      path_index: 3
      # The ROM's ~32 MB of assets are .rodata, so data progress is near zero and
      # will stay there for a long time. It is reported anyway because a dimension
      # that is not measured is published as 100% complete, and because moving a
      # global into C should be visible. Code and data are kept as separate
      # percentages so the 32 MB does not swamp the code figure.
      report_data: True
      prefixes_to_trim:
        - build/us/
        - build/jp/
        - build/eu/
        - build/

      # Module names come from the ROM's own task and mode registration tables
      # (tools/gen_symbols.py), so these buckets group by evidence, not guesswork.
      # Anything whose subsystem is not established stays in `named` or `unidentified`.
      categories:
        # Specific groups first: prefix matching means `src/task` would otherwise
        # swallow `src/taskpool`. Do not add a bare `src` / `src/` path — mapfile_parser
        # synthesizes a folder-named `src` category for unmatched units, which then
        # also tags later units that already match core/game/sdk. Data is a dimension,
        # not a category, so each bucket reports its own code and data; unattributed
        # bytes sit in `other` until the unit that owns them is written.
        - id: core
          name: Core engine
          paths:
            - src/main
            - src/malloc
            - src/taskpool
            - src/task
            - src/key
            - src/sprite
            - src/engine
            - src/sio
            - src/pallet
            - src/util
            - src/save
            - asm/header
            - asm/crt0

        - id: sdk
          name: SDK
          paths:
            - src/m4a
            - asm/m4a_1
            - src/agb_sram
            - asm/libagbsyscall
            - asm/movie_codec
            - src/movie
            - src/snd_stream
            - src/audio_block_codec

        - id: thirdparty
          name: Third party
          paths:
            - lib/

        - id: game
          name: Game code
          paths:
            - src/btl
            - src/bos
            - src/emy
            - src/pc
            - src/hum
            - src/card
            - src/continue_ui
            - src/mode_
            - src/acgtrans
            - src/allmap
            - src/chara
            - src/evt
            - src/fld
            - src/frd
            - src/lockon
            - src/monsgage
            - src/ms
            - src/poo
            - src/romcri
            - src/room
            - src/smn
            - src/sroll
            - src/status
            - src/title
            - src/tutorial
            - src/wlogo
            - src/unk_
            - src/map
            - src/map_tasks
            - src/actor_localized_data
            - src/actor_ui_resource_data
            - src/animation_resource_data
            - src/aux_animation_data
            - src/backupstat_data
            - src/battle_field_state
            - src/battle_localized_data
            - src/battle_runtime
            - src/debug_menu_data
            - src/event_background_data
            - src/event_chara_data
            - src/event_index_data
            - src/event_message
