name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [us, jp, eu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi ninja-build

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install agbcc
        run: |
          git clone --depth 1 https://github.com/pret/agbcc /tmp/agbcc
          cd /tmp/agbcc && ./build.sh && ./install.sh "$GITHUB_WORKSPACE"

      # ROMs are not committed. Host them privately and set the repository
      # secret BASEROM_URL to a base URL such that
      # "$BASEROM_URL/<code>.gba" resolves (codes: B8CE, B8CJ, B8CP).
      - name: Fetch base ROM
        env:
          BASEROM_URL: ${{ secrets.BASEROM_URL }}
        run: |
          if [ -z "$BASEROM_URL" ]; then
            echo "::error::BASEROM_URL secret is not set; cannot fetch base ROM."
            exit 1
          fi
          case "${{ matrix.version }}" in
            us) CODE=B8CE ;;
            jp) CODE=B8CJ ;;
            eu) CODE=B8CP ;;
          esac
          mkdir -p roms
          curl -fsSL -o "roms/$CODE.gba" "$BASEROM_URL/$CODE.gba"

      - name: Build and verify
        run: |
          python3 configure.py --version ${{ matrix.version }}
          ninja

      - name: Generate progress report
        if: matrix.version != 'eu'
        run: python3 -m mapfile_parser objdiff_report report.json --version ${{ matrix.version }}

      - name: Upload progress report artifact
        if: matrix.version != 'eu'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          path: report.json
          if-no-files-found: error
